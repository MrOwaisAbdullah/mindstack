<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Placeholder hero: a neural "brain" mark in the theme indigo/violet
       palette. Replace with the AI-generated portrait (brain-hero.png)
       when it exists — templates/home.html points here. -->
  <defs>
    <linearGradient id="g1" x1="60" y1="80" x2="270" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9b7cc4"/>
    </linearGradient>
    <radialGradient id="g2" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#g2)"/>

  <!-- brain silhouette -->
